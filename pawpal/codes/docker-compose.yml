# Local PostgreSQL + Redis for development. Run: pnpm db:up
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pawpal
      POSTGRES_USER: pawpal
      POSTGRES_PASSWORD: pawpal
    ports: ["5433:5432"] # 5433 on your PC, so it never clashes with another PostgreSQL on 5432
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  postgres-data:
